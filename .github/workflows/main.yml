name: A workflow for my Hello World App
on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: action/chechout@v5
      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Compule with Maven
        run: mvn compile
      - name: Builf Docker Image
        run: docker build -t devopsimage
      - name: Run image
        run: docler run --name devopscontainer -d devopsimage
      - name: view logs
        run: docker logs -f devopscontainer
