name: Population project build
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  Tests:
    name: Unit and Integration Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Start the database
        run: docker compose up -d --build db

      - name: Wait for the world database to finish loading
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T db mysql -uroot -pexample -e "SELECT COUNT(*) FROM world.city" > /dev/null 2>&1; then
              echo "Database is ready"
              exit 0
            fi
            echo "Waiting for the database ($i)..."
            sleep 3
          done
          echo "Database did not become ready"
          exit 1

      - name: Unit and integration tests
        run: mvn --batch-mode test
        env:
          WORLD_DB_TESTS: "true"
          DB_LOCATION: localhost:3307

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Show database logs if it failed
        if: failure()
        run: docker compose logs db

      - name: Stop the database
        if: always()
        run: docker compose down

  Package:
    name: Build JAR and Release
    needs: Tests
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Package application
        run: mvn --batch-mode package -DskipTests

      - name: Release
        if: github.event_name == 'push'
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          automatic_release_tag: "latest"
          files: |
            ./target/*.jar

  build:
    name: Build and Run in Docker
    needs: Package
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Package and run docker compose
        run: |
          mvn --batch-mode package -DskipTests
          docker compose up --build --abort-on-container-exit --exit-code-from app

      - name: Show container logs if it failed
        if: failure()
        run: docker compose logs