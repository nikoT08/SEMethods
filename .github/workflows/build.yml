name: Population project build
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Unit Tests
        run: mvn --batch-mode -Dtest=com.napier.sem.AppTest test

      - name: CodeCov
        uses: codecov/codecov-action@v2
        with:
          directory: ./target/site/jacoco
          flags: Unit Tests
          verbose: true

  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Start database
        run: docker compose up -d --build db

      - name: Wait for the database to load
        shell: bash
        run: |
          for i in {1..40}; do
            if docker compose exec -T db mysql -h 127.0.0.1 -uroot -pexample -e "SELECT COUNT(*) FROM world.countrylanguage" > /dev/null 2>&1; then
              echo "Database is ready"
              exit 0
            fi
            echo "Waiting for database..."
            sleep 5
          done
          echo "Database never started"
          exit 1

      - name: Integration Tests
        run: mvn --batch-mode -Dtest=com.napier.sem.ReportIntegrationTest test

      - name: CodeCov
        uses: codecov/codecov-action@v2
        with:
          directory: ./target/site/jacoco
          flags: Integration Tests
          verbose: true

      - name: Show database logs if it failed
        if: failure()
        run: docker compose logs db

  Package:
    name: Build JAR and Release
    needs: [UnitTests, IntegrationTests]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Package application
        run: mvn --batch-mode package -DskipTests

      - name: Release
        if: github.event_name == 'push'
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          automatic_release_tag: "latest"
          files: |
            ./target/*.jar

  build:
    name: Build and Run in Docker
    needs: Package
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Package and run docker compose
        run: |
          mvn --batch-mode package -DskipTests
          docker compose up --build --abort-on-container-exit --exit-code-from app

      - name: Show container logs if it failed
        if: failure()
        run: docker compose logs
