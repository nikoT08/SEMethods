name: Population project tests
on: push

jobs:
  build:
    name: Unit Tests and Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Unit Tests
        run: mvn --batch-mode -Dtest=com.napier.devops.AppTest test

      - name: Package application
        run: mvn --batch-mode package -DskipTests

      - name: Build application Docker image
        run: docker compose build app

  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Start database
        run: docker compose up -d --build db

      - name: Wait for country data
        shell: bash
        run: |
          for attempt in {1..60}; do
            if docker compose exec -T db mysql \
              --protocol=TCP -h127.0.0.1 \
              -uroot -pexample world \
              -e "SELECT COUNT(*) FROM country;"; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs db
          exit 1

      - name: Run integration tests
        run: mvn --batch-mode -Dtest=com.napier.sem.ReportIntegrationTest test

      - name: Stop containers
        if: always()
        run: docker compose down